<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طباعة الشيكات</title>
    <style>
        /* === 1. تنسيقات الألوان والشعارات الخاصة بالبنوك === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        /* تعريف ألوان البنوك بناءً على صورك */
        .bank-nbe { background-color: #e9f5ec; color: #005b2c; }
        .bank-nbe .container { background-color: #ffffff; border: 2px solid #005b2c; }
        .bank-nbe .logo-placeholder { background: url('https://upload.wikimedia.org/wikipedia/en/thumb/5/5d/National_Bank_of_Egypt_logo.svg/1200px-National_Bank_of_Egypt_logo.svg.png') no-repeat center/contain; }

        .bank-bm { background-color: #f2e6e8; color: #80263b; }
        .bank-bm .container { background-color: #ffffff; border: 2px solid #80263b; }
        .bank-bm .logo-placeholder { background: url('https://upload.wikimedia.org/wikipedia/en/4/49/Banque_Misr_Logo.png') no-repeat center/contain; }

        .bank-bdc { background-color: #fdf5ed; color: #ed5d25; }
        .bank-bdc .container { background-color: #ffffff; border: 2px solid #ed5d25; }
        .bank-bdc .logo-placeholder { background: url('https://upload.wikimedia.org/wikipedia/en/e/e7/Banque_du_Caire_logo.png') no-repeat center/contain; }

        .bank-ealb { background-color: #e6f7fe; color: #00aeef; }
        .bank-ealb .container { background-color: #ffffff; border: 2px solid #00aeef; }
        .bank-ealb .logo-placeholder { background: url('https://upload.wikimedia.org/wikipedia/en/9/9b/Egyptian_Arab_Land_Bank_logo.png') no-repeat center/contain; }

        /* تنسيق الشعار */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        .logo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #eee;
        }
        .bank-selector select {
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
        }

        /* تنسيق الإدخال */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* منع تجاوز العرض */
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            flex: 1;
        }
        .btn-save { background-color: #28a745; }
        .btn-print { background-color: #007bff; }
        button:hover { opacity: 0.8; }

        /* === 4. إعدادات الطباعة للحصول على ورقة واحدة === */
        @media print {
            /* إخفاء كل العناصر غير المرغوب فيها */
            body * { visibility: hidden; }
            .header, .form-group, .buttons { display: none !important; }

            /* إظهار الشيك فقط */
            #cheque-print-area, #cheque-print-area * {
                visibility: visible;
            }
            
            #cheque-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                border: none !important;
            }

            /* === 5. ضبط مقاس الطباعة على مقاس الشيك === */
            @page {
                size: 220mm 100mm; /* مقاس الشيك (الطول والعرض) - قم بتعديلهما حسب شيكك */
                margin: 0mm; /* إزالة الهوامش */
            }
            
            .cheque-design {
                border: 1px solid #000;
                padding: 20px;
                height: 100%; /* التعبئة الكاملة للورقة */
                width: 100%;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-size: 20px;
            }
        }

        /* تصميم الشيك للعرض على الشاشة */
        #cheque-print-area {
            margin-top: 30px;
            border: 2px dashed #999;
            padding: 10px;
            min-height: 100px;
            background-color: #f9f9f9;
        }
        .cheque-design {
            padding: 15px;
            border: 1px solid #444;
            background: white;
        }
    </style>
</head>
<body class="bank-nbe"> <!-- الوضع الافتراضي -->

    <div class="container">
        <div class="header">
            <div class="logo-placeholder"></div>
            <div class="bank-selector">
                <label for="bankSelect">اختر البنك:</label>
                <select id="bankSelect" onchange="changeBank()">
                    <option value="bank-nbe">البنك الأهلي المصري (NBE)</option>
                    <option value="bank-bm">بنك مصر (BM)</option>
                    <option value="bank-bdc">بنك القاهرة (BDC)</option>
                    <option value="bank-ealb">البنك العربي الأفريقي (EALB)</option>
                </select>
            </div>
        </div>

        <!-- نموذج الإدخال -->
        <h3>بيانات الشيك</h3>
        <form id="chequeForm">
            <div class="form-group">
                <label>اسم المستفيد:</label>
                <input type="text" id="beneficiaryName" placeholder="أدخل اسم المستفيد">
            </div>
            <div class="form-group">
                <label>المبلغ (بالأرقام):</label>
                <input type="text" id="amount" placeholder="أدخل المبلغ">
            </div>
            <div class="form-group">
                <label>تفاصيل الخطاب (اختياري):</label>
                <textarea id="letterText" rows="3" placeholder="أدخل تفاصيل الخطاب"></textarea>
            </div>

            <div class="buttons">
                <button type="button" class="btn-save" onclick="saveData()">حفظ السجل</button>
                <button type="button" class="btn-print" onclick="printCheque()">طباعة الشيك</button>
            </div>
        </form>

        <!-- === منطقة طباعة الشيك (المحتوى الذي سيتم طباعته فقط) === -->
        <div id="cheque-print-area">
            <div class="cheque-design">
                <h2 style="margin:0;">شيك بنكي</h2>
                <hr style="width:100%;">
                <p><strong>المستفيد:</strong> <span id="printName">---</span></p>
                <p><strong>المبلغ:</strong> <span id="printAmount">---</span></p>
                <p><strong>التفاصيل:</strong> <span id="printLetter">---</span></p>
                <p style="text-align:left; margin-top:30px; font-size:14px;">التوقيع: __________________</p>
            </div>
        </div>
    </div>

    <script>
        // عند تحميل الصفحة (تطبيق النقطة رقم 2: استرجاع البيانات)
        window.onload = function() {
            const savedName = localStorage.getItem('lastBeneficiaryName');
            const savedAmount = localStorage.getItem('lastAmount');
            const savedLetter = localStorage.getItem('lastLetter');

            if (savedName) document.getElementById('beneficiaryName').value = savedName;
            if (savedAmount) document.getElementById('amount').value = savedAmount;
            if (savedLetter) document.getElementById('letterText').value = savedLetter;

            // تحديث معاينة الشيك
            updateChequePreview();
        };

        // دالة تغيير البنك (النقطة رقم 1: الألوان)
        function changeBank() {
            const body = document.body;
            const selectedBank = document.getElementById('bankSelect').value;
            
            // إزالة كل الكلاسات القديمة وإضافة الجديد
            body.className = selectedBank;
        }

        // دالة تحديث المعاينة
        function updateChequePreview() {
            document.getElementById('printName').innerText = document.getElementById('beneficiaryName').value || "---";
            document.getElementById('printAmount').innerText = document.getElementById('amount').value || "---";
            document.getElementById('printLetter').innerText = document.getElementById('letterText').value || "---";
        }

        // الاستماع للتغيير في الحقول لتحديث المعاينة
        document.getElementById('beneficiaryName').addEventListener('input', updateChequePreview);
        document.getElementById('amount').addEventListener('input', updateChequePreview);
        document.getElementById('letterText').addEventListener('input', updateChequePreview);

        // === 2 و 3. الحفظ، وتخزين البيانات، ومسح الشاشة ===
        function saveData() {
            const name = document.getElementById('beneficiaryName').value;
            const amount = document.getElementById('amount').value;
            const letter = document.getElementById('letterText').value;

            if(!name || !amount) {
                alert("يرجى إدخال اسم المستفيد والمبلغ");
                return;
            }

            // حفظ البيانات في المتصفح
            localStorage.setItem('lastBeneficiaryName', name);
            localStorage.setItem('lastAmount', amount);
            localStorage.setItem('lastLetter', letter);

            alert("تم حفظ السجل بنجاح!");

            // مسح الشاشة بعد الحفظ
            document.getElementById('chequeForm').reset();
            // ملاحظة: reset لا تمسح الـ LocalStorage، لذا البيانات محفوظة.
            // نقوم بتحديث المعاينة لتصبح فارغة
            updateChequePreview();
        }

        // === 4 و 5. الطباعة (ورقة واحدة ومقاس الشيك) ===
        function printCheque() {
            // تحديث المعاينة قبل الطباعة للتأكد من وجود أحدث البيانات
            updateChequePreview();
            
            // استدعاء نافذة الطباعة
            window.print();
        }
    </script>
</body>
</html>
