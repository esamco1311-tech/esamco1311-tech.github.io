<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة الشيكات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .login-section, .form-section {
            display: none;
        }
        .login-section.active, .form-section.active {
            display: block;
        }
        input, select, button, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .bank-option {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bank-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        /* ألوان البنوك المختلفة */
        .bank-ahly { background-color: #e74c3c; color: white; }
        .bank-misr { background-color: #f39c12; color: white; }
        .bank-cai { background-color: #27ae60; color: white; }
        .bank-qnb { background-color: #9b59b6; color: white; }
        .bank-alex { background-color: #1abc9c; color: white; }
        .bank-other { background-color: #34495e; color: white; }

        .check-preview {
            margin-top: 30px;
            border: 2px dashed #ccc;
            padding: 20px;
            background: #fff;
        }
        .check-sheet {
            width: 210mm; /* عرض ورق الشيك القياسي */
            height: 99mm; /* ارتفاع ورق الشيك القياسي */
            border: 1px solid #000;
            padding: 10mm;
            margin: 0 auto;
            background: white;
            position: relative;
        }
        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            font-weight: bold;
            color: #2c3e50;
        }
        .history-section {
            margin-top: 40px;
        }
        .history-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: #fafafa;
        }

        /* إعدادات الطباعة: ورقة واحدة فقط وبدون عناصر زائدة */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .container, .form-section > *:not(.check-preview), button, .history-section, h1, label, input, select, textarea {
                display: none !important;
            }
            .check-preview {
                display: block;
                margin: 0;
                padding: 0;
            }
            .check-sheet {
                width: 210mm;
                height: 99mm;
                margin: 0;
                border: none;
                page-break-after: avoid; /* منع تقسيم الشيك لأكثر من صفحة */
                page-break-before: avoid;
            }
            @page {
                size: A4;
                margin: 0; /* إزالة الهوامش الافتراضية لضبط الموضع في درج الطابعة */
            }
        }
    </style>
    <!-- إضافة خط عربي جميل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- قسم تسجيل الدخول -->
        <div class="login-section active" id="loginSection">
            <h1>تسجيل الدخول</h1>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة السر للدخول">
            <button onclick="login()">دخول</button>
        </div>

        <!-- قسم إدخال البيانات والطباعة -->
        <div class="form-section" id="formSection">
            <h1>طباعة الشيكات</h1>

            <!-- اختيار البنك -->
            <div class="form-group">
                <label>اختر البنك:</label>
                <select id="bankSelect" onchange="updateBankDisplay()">
                    <option value="">-- اختر البنك --</option>
                    <option value="البنك الأهلي المصري" class="bank-ahly">البنك الأهلي المصري</option>
                    <option value="بنك مصر" class="bank-misr">بنك مصر</option>
                    <option value="البنك التجاري الدولي CIB" class="bank-cai">البنك التجاري الدولي CIB</option>
                    <option value="بنك QNB الأهلي" class="bank-qnb">بنك QNB الأهلي</option>
                    <option value="بنك الإسكندرية" class="bank-alex">بنك الإسكندرية</option>
                    <option value="بنك آخر" class="bank-other">بنك آخر</option>
                </select>
                <div id="bankDisplay" style="margin-top:10px; padding:8px; border-radius:5px; display:flex; align-items:center; gap:8px;"></div>
            </div>

            <!-- بيانات الشيك -->
            <div class="form-row">
                <div class="form-group">
                    <label>اسم المستفيد</label>
                    <input type="text" id="beneficiary" list="beneficiaryList" placeholder="اكتب اسم المستفيد">
                    <datalist id="beneficiaryList"></datalist>
                </div>
                <div class="form-group">
                    <label>المبلغ بالأرقام</label>
                    <input type="number" id="amountNum" placeholder="0.00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>المبلغ بالحروف</label>
                    <input type="text" id="amountWords" placeholder="المبلغ بالحروف">
                </div>
                <div class="form-group">
                    <label>التاريخ</label>
                    <input type="date" id="checkDate">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>رقم الشيك</label>
                    <input type="text" id="checkNumber" placeholder="رقم الشيك">
                </div>
                <div class="form-group">
                    <label>رقم الحساب</label>
                    <input type="text" id="accountNumber" placeholder="رقم الحساب">
                </div>
            </div>

            <!-- بيانات الخطاب -->
            <div class="form-group">
                <label>بيانات الخطاب</label>
                <textarea id="letterData" list="letterList" rows="4" placeholder="أدخل بيانات الخطاب"></textarea>
                <datalist id="letterList"></datalist>
            </div>

            <button onclick="saveAndClear()">حفظ</button>
            <button onclick="printCheck()">طباعة الشيك</button>

            <!-- معاينة الشيك -->
            <div class="check-preview">
                <h3>معاينة الشيك</h3>
                <div class="check-sheet" id="checkSheet">
                    <div id="checkBankDisplay" style="font-weight:bold; margin-bottom:15px;"></div>
                    <div style="margin-bottom:10px;">المستفيد: <span id="previewBeneficiary"></span></div>
                    <div style="margin-bottom:10px;">المبلغ: <span id="previewAmountNum"></span> فقط <span id="previewAmountWords"></span></div>
                    <div style="margin-bottom:10px;">التاريخ: <span id="previewDate"></span></div>
                    <div style="margin-bottom:10px;">رقم الشيك: <span id="previewCheckNumber"></span></div>
                    <div style="margin-bottom:10px;">رقم الحساب: <span id="previewAccountNumber"></span></div>
                    <div style="margin-top:20px; padding-top:10px; border-top:1px solid #000;">البيان: <span id="previewLetter"></span></div>
                </div>
            </div>

            <!-- سجل العمليات -->
            <div class="history-section">
                <h2>سجل الشيكات المحفوظة</h2>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // كلمة المرور - يمكنك تغييرها كما تريد
        const CORRECT_PASSWORD = "123456";

        // شعارات البنوك (باستخدام روابط أيقونات مباشرة)
        const bankLogos = {
            "البنك الأهلي المصري": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/National_Bank_of_Egypt_Logo.svg/100px-National_Bank_of_Egypt_Logo.svg.png",
            "بنك مصر": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Banque_Misr_Logo.svg/100px-Banque_Misr_Logo.svg.png",
            "البنك التجاري الدولي CIB": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/CIB_Egypt_Logo.svg/100px-CIB_Egypt_Logo.svg.png",
            "بنك QNB الأهلي": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/QNB_Logo.svg/100px-QNB_Logo.svg.png",
            "بنك الإسكندرية": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Bank_of_Alexandria_Logo.svg/100px-Bank_of_Alexandria_Logo.svg.png",
            "بنك آخر": ""
        };

        // ألوان البنوك
        const bankColors = {
            "البنك الأهلي المصري": "bank-ahly",
            "بنك مصر": "bank-misr",
            "البنك التجاري الدولي CIB": "bank-cai",
            "بنك QNB الأهلي": "bank-qnb",
            "بنك الإسكندرية": "bank-alex",
            "بنك آخر": "bank-other"
        };

        // التحقق من كلمة المرور
        function login() {
            const pass = document.getElementById("passwordInput").value;
            if (pass === CORRECT_PASSWORD) {
                document.getElementById("loginSection").classList.remove("active");
                document.getElementById("formSection").classList.add("active");
                loadSavedSuggestions();
                loadHistory();
                // تحديث المعاينة تلقائياً عند الكتابة
                attachInputListeners();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // تحديث عرض البنك باللون والشعار
        function updateBankDisplay() {
            const selectedBank = document.getElementById("bankSelect").value;
            const displayDiv = document.getElementById("bankDisplay");
            const previewBank = document.getElementById("checkBankDisplay");
            
            if (selectedBank) {
                displayDiv.className = bankColors[selectedBank];
                previewBank.className = bankColors[selectedBank];
                
                if (bankLogos[selectedBank]) {
                    displayDiv.innerHTML = `<img src="${bankLogos[selectedBank]}" class="bank-logo" alt="شعار"> ${selectedBank}`;
                    previewBank.innerHTML = `<img src="${bankLogos[selectedBank]}" class="bank-logo" alt="شعار"> ${selectedBank}`;
                } else {
                    displayDiv.textContent = selectedBank;
                    previewBank.textContent = selectedBank;
                }
            } else {
                displayDiv.innerHTML = "";
                previewBank.innerHTML = "";
            }
            updatePreview();
        }

        // تحميل الاقتراحات المحفوظة
        function loadSavedSuggestions() {
            const beneficiaries = JSON.parse(localStorage.getItem("beneficiaries") || "[]");
            const beneficiaryList = document.getElementById("beneficiaryList");
            beneficiaryList.innerHTML = "";
            beneficiaries.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                beneficiaryList.appendChild(option);
            });

            const letters = JSON.parse(localStorage.getItem("letters") || "[]");
            const letterList = document.getElementById("letterList");
            letterList.innerHTML = "";
            letters.forEach(text => {
                const option = document.createElement("option");
                option.value = text;
                letterList.appendChild(option);
            });
        }

        // ربط حقول الإدخال بتحديث المعاينة
        function attachInputListeners() {
            const inputs = document.querySelectorAll("input, select, textarea");
            inputs.forEach(input => {
                input.addEventListener("input", updatePreview);
            });
        }

        // تحديث منطقة المعاينة
        function updatePreview() {
            document.getElementById("previewBeneficiary").textContent = document.getElementById("beneficiary").value;
            document.getElementById("previewAmountNum").textContent = document.getElementById("amountNum").value;
            document.getElementById("previewAmountWords").textContent = document.getElementById("amountWords").value;
            document.getElementById("previewDate").textContent = document.getElementById("checkDate").value;
            document.getElementById("previewCheckNumber").textContent = document.getElementById("checkNumber").value;
            document.getElementById("previewAccountNumber").textContent = document.getElementById("accountNumber").value;
            document.getElementById("previewLetter").textContent = document.getElementById("letterData").value;
        }

        // حفظ البيانات ومسح الحقول تلقائياً
        function saveAndClear() {
            // جمع البيانات
            const bank = document.getElementById("bankSelect").value;
            const beneficiary = document.getElementById("beneficiary").value.trim();
            const amountNum = document.getElementById("amountNum").value;
            const amountWords = document.getElementById("amountWords").value.trim();
            const date = document.getElementById("checkDate").value;
            const checkNumber = document.getElementById("checkNumber").value.trim();
            const accountNumber = document.getElementById("accountNumber").value.trim();
            const letterData = document.getElementById("letterData").value.trim();

            if (!beneficiary || !amountNum) {
                alert("يرجى ملء البيانات الأساسية (اسم المستفيد والمبلغ)");
                return;
            }

            // حفظ الاسم والنص للاقتراحات المستقبلية
            let beneficiaries = JSON.parse(localStorage.getItem("beneficiaries") || "[]");
            if (!beneficiaries.includes(beneficiary)) {
                beneficiaries.push(beneficiary);
                localStorage.setItem("beneficiaries", JSON.stringify(beneficiaries));
            }

            if (letterData) {
                let letters = JSON.parse(localStorage.getItem("letters") || "[]");
                if (!letters.includes(letterData)) {
                    letters.push(letterData);
                    localStorage.setItem("letters", JSON.stringify(letters));
                }
            }

            // حفظ في السجل
            const history = JSON.parse(localStorage.getItem("checkHistory") || "[]");
            history.unshift({
                bank, beneficiary, amountNum, amountWords, date, checkNumber, accountNumber, letterData, time: new Date().toLocaleString("ar-EG")
            });
            localStorage.setItem("checkHistory", JSON.stringify(history));

            // مسح جميع الحقول تلقائياً
            document.getElementById("bankSelect").value = "";
            document.getElementById("beneficiary").value = "";
            document.getElementById("amountNum").value = "";
            document.getElementById("amountWords").value = "";
            document.getElementById("checkDate").value = "";
            document.getElementById("checkNumber").value = "";
            document.getElementById("accountNumber").value = "";
            document.getElementById("letterData").value = "";
            
            // إعادة تعيين عرض البنك وتحديث المعاينة
            updateBankDisplay();
            updatePreview();

            // إعادة تحميل الاقتراحات
            loadSavedSuggestions();
            loadHistory();

            alert("تم الحفظ بنجاح وتم مسح البيانات!");
        }

        // تحميل سجل العمليات
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem("checkHistory") || "[]");
            const historyList = document.getElementById("historyList");
            historyList.innerHTML = "";

            if (history.length === 0) {
                historyList.innerHTML = "<p>لا يوجد شيكات محفوظة حتى الآن</p>";
                return;
            }

            history.forEach(item => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = `
                    <strong>${item.bank}</strong> - ${item.time}<br>
                    المستفيد: ${item.beneficiary}<br>
                    المبلغ: ${item.amountNum} (${item.amountWords})<br>
                    التاريخ: ${item.date} - رقم الشيك: ${item.checkNumber}
                `;
                historyList.appendChild(div);
            });
        }

        // دالة الطباعة
        function printCheck() {
            window.print();
        }
    </script>
</body>
</html>
